name: Manuscript traceability

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyscf numpy scipy matplotlib pytest

      - name: Forensic MnF reproduction (fast)
        run: python scripts/reproduce_preprint_tables.py

      - name: Regenerate LaTeX macros
        run: python scripts/emit_manuscript_macros.py

      - name: Install TeX (PDF build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Drift check and PDF build tests
        run: |
          pytest tests/ -q
          bash scripts/build_paper_pdf.sh